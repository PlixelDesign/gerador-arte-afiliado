<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Arte — Depósito do Nô</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-brand">
    <span class="header-title">Gerador de Arte</span>
    <span class="header-sub">@depositodonobetim</span>
  </div>
  <div class="header-ig">
    <label for="ig-handle">@ Instagram</label>
    <input type="text" id="ig-handle" class="input-ig" placeholder="@seu_perfil">
  </div>
</header>

<main>

  <section class="section" id="section-input">
    <div class="section-title">Produto</div>
    <div class="input-row">
      <input type="text" id="ml-url" class="input"
        placeholder="https://produto.mercadolivre.com.br/MLB-...">
      <button id="btn-fetch" class="btn btn-primary">Buscar</button>
    </div>
    <div id="error-msg" class="error-msg hidden"></div>
  </section>

  <div id="loading-product" class="state-loading hidden">
    <div class="spinner"></div>
    <span>Buscando produto…</span>
  </div>

  <div id="loading-bg" class="state-loading hidden">
    <div class="progress-bar-wrap">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <span id="progress-label">Processando imagem… 0%</span>
  </div>

  <section class="section hidden" id="section-fields">
    <div class="section-title">Campos</div>
    <div class="fields-grid">
      <div class="field-group field-group--full">
        <label class="label" for="f-name">Nome (linha 1)</label>
        <input type="text" id="f-name" class="input">
      </div>
      <div class="field-group field-group--full">
        <label class="label" for="f-subtitle">Subtítulo (linha 2)</label>
        <input type="text" id="f-subtitle" class="input">
      </div>
      <div class="field-group">
        <label class="label" for="f-installments">Parcelas</label>
        <input type="text" id="f-installments" class="input">
      </div>
      <div class="field-group">
        <label class="label" for="f-price">Preço</label>
        <input type="text" id="f-price" class="input">
      </div>
      <div class="field-group field-group--full">
        <label class="label" for="f-badge">Desconto (ex: 20% OFF)</label>
        <input type="text" id="f-badge" class="input" placeholder="Opcional">
      </div>
    </div>
    <div id="warning-bg" class="warning-msg hidden">
      ⚠️ Não foi possível remover o fundo da imagem. Usando imagem original.
    </div>
  </section>

  <section class="section hidden" id="section-templates">
    <div class="section-title">Template</div>
    <div class="template-grid" id="template-grid"></div>
  </section>

  <section class="section hidden" id="section-preview">
    <div class="section-title">Preview</div>
    <div class="canvas-wrap">
      <canvas id="main-canvas"></canvas>
    </div>
  </section>

  <section class="section hidden" id="section-download">
    <button id="btn-download" class="btn btn-primary btn-large">↓ Baixar PNG</button>
  </section>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
